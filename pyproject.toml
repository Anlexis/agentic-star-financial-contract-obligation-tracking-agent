[project]
name = "fin-c2-077"
version = "0.1.0"
description = "FinancialContractReviewAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repository generation — a stub package on PYTHONPATH for older repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in the pipeline definition). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    # Stub package for PyYAML, which src/runtime_config.py imports lazily.
    # Exact-pinned at the version this repo's type check was verified against.
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The samples are read-only reference material for the next template author;
# they are type-checked by the reader, not by this repo's gate.
exclude = ["src/examples/"]
# Published-wheel compatibility exception: the agenticstar-agentcore wheel
# ships no py.typed marker, so framework.* / shared.* imports resolve to Any —
# which makes every required framework subclass a "subclass of Any" error.
# Every other strict setting stays on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# State extends the framework's AgentState TypedDict — correct at runtime, but
# the untyped wheel makes AgentState `Any`, so mypy cannot see the TypedDict
# base and mis-flags every field declaration with valid-type. One cause, many
# symptoms: silence only that diagnostic, only for that module.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
